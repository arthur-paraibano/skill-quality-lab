[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "skill-quality-lab"
dynamic = ["version"]
description = "Audit, test, package, and install Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Arthur Paraibano", email = "arthurmik860@gmail.com" },
]
keywords = ["agent-skills", "codex", "claude", "quality", "testing", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.urls]
Homepage = "https://github.com/arthur-paraibano/skill-quality-lab"
Repository = "https://github.com/arthur-paraibano/skill-quality-lab"
Issues = "https://github.com/arthur-paraibano/skill-quality-lab/issues"

[project.scripts]
skill-quality-lab = "skill_quality_lab.cli:main"

[tool.hatch.version]
path = "scripts/skill_quality_lab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["scripts/skill_quality_lab"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "skill_quality_lab/bundled_skill/SKILL.md"
"LICENSE" = "skill_quality_lab/bundled_skill/LICENSE"
"agents" = "skill_quality_lab/bundled_skill/agents"
"references" = "skill_quality_lab/bundled_skill/references"
"scripts/requirements.txt" = "skill_quality_lab/bundled_skill/scripts/requirements.txt"

[tool.hatch.build.targets.sdist]
include = [
  "/.github",
  "/agents",
  "/references",
  "/scripts",
  "/tests",
  "/.gitignore",
  "/LICENSE",
  "/README.md",
  "/SKILL.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

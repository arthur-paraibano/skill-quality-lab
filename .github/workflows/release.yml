name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: skill-quality-lab doctor

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v\d+\.\d+\.\d+", tag) is None:
              raise SystemExit(f"invalid release tag: {tag}")
          PY
      - name: Install build tools
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Verify artifact versions match tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import email
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, found {wheels=} {sdists=}")

          with zipfile.ZipFile(wheels[0]) as archive:
              names = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(names) != 1:
                  raise SystemExit(f"expected one wheel METADATA file, found {names}")
              wheel_metadata = email.message_from_bytes(archive.read(names[0]))

          with tarfile.open(sdists[0], "r:gz") as archive:
              members = [member for member in archive.getmembers() if member.name.endswith("/PKG-INFO")]
              if len(members) != 1:
                  raise SystemExit(f"expected one sdist PKG-INFO file, found {members}")
              stream = archive.extractfile(members[0])
              if stream is None:
                  raise SystemExit("could not read sdist PKG-INFO")
              sdist_metadata = email.message_from_bytes(stream.read())

          for artifact, metadata in ((wheels[0], wheel_metadata), (sdists[0], sdist_metadata)):
              actual = metadata["Version"]
              if actual != expected:
                  raise SystemExit(f"{artifact.name} has version {actual}, expected {expected}")
              print(f"{artifact.name}: version {actual}, metadata {metadata['Metadata-Version']}")
          PY
      - name: Smoke-test exact release wheel
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist, found {wheels=} {sdists=}")
          PY
          python -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/release-venv/bin/skill-quality-lab" --version
          "$RUNNER_TEMP/release-venv/bin/skill-quality-lab" doctor
          export CODEX_HOME="$RUNNER_TEMP/codex-release-smoke"
          "$RUNNER_TEMP/release-venv/bin/skill-quality-lab" install --client codex
          "$RUNNER_TEMP/release-venv/bin/skill-quality-lab" audit \
            "$CODEX_HOME/skills/skill-quality-lab" --profile codex --strict
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/skill-quality-lab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/skill-quality-lab
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
